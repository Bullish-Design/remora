[project]
name = "persistent-tree-sitter-ids-template"
version = "0.1.0"
description = "Template scaffold for persistent tree-sitter node IDs using inline graph:id comments"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "tree-sitter>=0.25",
  "tree-sitter-python>=0.23",
  "tree-sitter-markdown>=0.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "mypy>=1.14",
]

[project.scripts]
persistent-ids = "persistent_ids.cli:main"

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/persistent_ids"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
